name: A-Stock AlphaGPT routine

on:
  schedule:
    - cron: '13 8 * * *'      # UTC 08:13 = 北京时间 16:13（收盘后）
  workflow_dispatch:
    inputs:
      version:
        description: '版本：v2=横截面优化版（默认）, v1=原始单标的版'
        required: false
        default: 'v2'
      best_formula:
        description: '指定公式（留空则用仓库变量 BEST_FORMULA；再留空则现场训练）'
        required: false
        default: ''
      train_iterations:
        description: '训练轮数覆盖（留空则用仓库变量）'
        required: false
        default: ''
      start_date:
        description: '数据起始日 YYYYMMDD（留空则用仓库变量）'
        required: false
        default: ''
      end_date:
        description: '数据结束日 YYYYMMDD（留空则用仓库变量）'
        required: false
        default: ''

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch pandas numpy akshare matplotlib pyarrow tqdm baostock

      - name: Run analysis
        env:
          # --- v2 横截面参数 ---
          UNIVERSE: ${{ vars.UNIVERSE || '600519,600036,601318,600030,600276,600887,601899,600900,601088,600309,601166,600585' }}
          HOLD_PERIOD: ${{ vars.HOLD_PERIOD || 5 }}
          TOP_N: ${{ vars.TOP_N || 5 }}
          MIN_PICKS: ${{ vars.MIN_PICKS || 3 }}
          SEED: ${{ vars.SEED || 42 }}
          MIN_TRADES: ${{ vars.MIN_TRADES || 12 }}
          MIN_STOCK_PASS: ${{ vars.MIN_STOCK_PASS || 0.9 }}
          # 因子集（留空 = 全部 6 个含两融；深市股票无两融数据时建议只用价量因子）
          FACTORS: ${{ vars.FACTORS || 'RET,RET5,VOL_CHG,V_RET,TREND' }}
          # --- 通用 ---
          START_DATE: ${{ github.event.inputs.start_date || vars.START_DATE || '20220101' }}
          END_DATE: ${{ github.event.inputs.end_date || vars.END_DATE || '20261231' }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || 1024 }}
          TRAIN_ITERATIONS: ${{ github.event.inputs.train_iterations || vars.TRAIN_ITERATIONS || 200 }}
          MAX_SEQ_LEN: ${{ vars.MAX_SEQ_LEN || 10 }}
          FORCE_TRAIN: ${{ vars.FORCE_TRAIN || 'True' }}
          ONLY_LONG: ${{ vars.ONLY_LONG || 'True' }}
          LAST_NDAYS: ${{ vars.LAST_NDAYS || 10 }}
          BEST_FORMULA: ${{ github.event.inputs.best_formula || vars.BEST_FORMULA || '' }}
          # v1 兼容参数
          INDEX_CODE: ${{ vars.INDEX_CODE || '' }}
          # 钉钉
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK || '' }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET || '' }}
        run: |
          VERSION="${{ github.event.inputs.version || 'v2' }}"
          echo "运行版本: $VERSION"
          if [ "$VERSION" = "v1" ]; then
            python times_astock.py
          else
            python times_astock_v2.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add margin_balance/*.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update margin data [skip ci]" && git push)
